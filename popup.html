<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: #141414; color: #eee; }
  header { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid #333; }
  header button { flex: 1; font: inherit; color: #ccc; background: #222; border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px; cursor: pointer; }
  header button[aria-pressed="true"] { color: #fff; background: #e53935; border-color: #e53935; }
  #status { padding: 4px 10px; color: #888; font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0 0 6px; max-height: 440px; overflow-y: auto; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  li:hover { background: #1f1f1f; }
  li.new { background: #2a1a1a; }
  li img { width: 36px; height: 50px; object-fit: cover; border-radius: 4px; background: #222; flex: none; }
  li a { flex: 1; color: inherit; text-decoration: none; min-width: 0; }
  li a b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li a span { color: #999; font-size: 12px; }
  li.new a span { color: #ff8a80; }
  li button { font: inherit; color: #bbb; background: none; border: 1px solid #444; border-radius: 5px; padding: 3px 8px; cursor: pointer; flex: none; }
  li button.on { color: #81c784; border-color: #2e7d32; }
  button:focus-visible { outline: 2px solid #4a9eff; outline-offset: 1px; }
  .empty { padding: 16px 10px; color: #888; }
  #update { padding: 8px 10px; background: #1b3a1f; color: #c8e6c9; font-size: 12px; border-bottom: 1px solid #2e7d32; }
  #update a { color: #81c784; }
  li .bili { flex: none; font-size: 11px; color: #4fc3f7; text-decoration: none; white-space: nowrap; }
  li .bili.none { color: #777; }
  li.day { display: block; padding: 8px 10px 2px; font-weight: 700; color: #ff8a80; border-top: 1px solid #2a2a2a; }
  li.day.today { color: #fff; }
  li.day:hover { background: none; }
</style>
</head>
<body>
<header>
  <button id="t-follow" aria-pressed="true">ติดตาม</button>
  <button id="t-days" aria-pressed="false">ตามวัน</button>
  <button id="t-latest" aria-pressed="false">อัปเดตล่าสุด</button>
  <button id="refresh" title="เช็กเว็บตอนนี้">เช็กตอนนี้</button>
</header>
<div id="update" hidden></div>
<div id="status"></div>
<ul id="list"></ul>
<script src="parse.js"></script>
<script src="popup.js"></script>
</body>
</html>
